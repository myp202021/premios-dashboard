<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>S5 vs S6 — Premios Increíbles</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Montserrat',sans-serif;background:#0A0A0F;color:#fff;line-height:1.5;font-size:13px}
.c{max-width:1200px;margin:0 auto;padding:0 24px}
.hd{padding:20px 0;border-bottom:1px solid rgba(255,255,255,0.06);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
.hd h1{font-size:22px;font-weight:900}.hd .sub{font-size:11px;color:rgba(255,255,255,0.4)}
.strategy{display:inline-block;padding:4px 12px;border-radius:6px;background:rgba(16,185,129,0.12);border:1px solid rgba(16,185,129,0.3);font-size:10px;font-weight:700;color:#10B981;margin-left:8px}
.kg{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}
.k{background:#141418;border:1px solid rgba(255,255,255,0.06);border-radius:12px;padding:16px;text-align:center;position:relative;overflow:hidden}
.k::before{content:'';position:absolute;top:0;left:0;right:0;height:3px}
.k.s5::before{background:linear-gradient(90deg,#6366F1,#8B5CF6)}
.k.s6::before{background:linear-gradient(90deg,#E53935,#FFD700)}
.k.delta::before{background:linear-gradient(90deg,#10B981,#34D399)}
.kv{font-size:22px;font-weight:900;margin-bottom:2px}
.kv.s5c{color:#8B5CF6}
.kv.s6c{color:#FFD700}
.kl{font-size:8px;color:rgba(255,255,255,0.4);font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.ksub{font-size:10px;color:rgba(255,255,255,0.35);margin-top:2px}
.s{padding:20px 0;border-bottom:1px solid rgba(255,255,255,0.06)}
.st{font-size:14px;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.st::before{content:'';width:3px;height:14px;background:linear-gradient(135deg,#E53935,#FFD700);border-radius:2px}
.cd{background:#141418;border:1px solid rgba(255,255,255,0.06);border-radius:12px;padding:16px;margin-bottom:12px}
table{width:100%;border-collapse:separate;border-spacing:0;border-radius:10px;overflow:hidden;border:1px solid rgba(255,255,255,0.06);font-size:11px}
thead th{background:#1C1C24;color:rgba(255,255,255,0.5);padding:8px 10px;text-align:left;font-weight:700;font-size:9px;text-transform:uppercase;position:sticky;top:0;z-index:1}
thead th.r{text-align:right}
thead th.sep{border-left:2px solid rgba(255,215,0,0.3)}
tbody td{padding:7px 10px;border-bottom:1px solid rgba(255,255,255,0.03);color:rgba(255,255,255,0.7)}
tbody td.r{text-align:right;font-variant-numeric:tabular-nums}
tbody td.b{font-weight:700;color:#fff}
tbody td.sep{border-left:2px solid rgba(255,215,0,0.15)}
tbody tr:hover td{background:rgba(229,57,53,0.04)}
.up{color:#10B981}.dn{color:#EF4444}.nt{color:#F59E0B}
.chart-wrap{background:#141418;border:1px solid rgba(255,255,255,0.06);border-radius:12px;padding:16px;overflow-x:auto}
.legend{display:flex;gap:16px;margin-bottom:12px;font-size:10px}
.legend-item{display:flex;align-items:center;gap:5px}
.legend-dot{width:10px;height:10px;border-radius:50%}
.insight{background:rgba(16,185,129,0.06);border:1px solid rgba(16,185,129,0.15);border-radius:10px;padding:12px;margin-top:12px}
.insight h4{font-size:11px;font-weight:800;color:#10B981;margin-bottom:4px}
.insight p{font-size:10px;color:rgba(255,255,255,0.45);line-height:1.7}
.foot{padding:14px 0;text-align:center;font-size:9px;color:rgba(255,255,255,0.15)}
.back{color:rgba(255,255,255,0.3);text-decoration:none;font-size:11px;font-weight:600}
.back:hover{color:#FFD700}
@media(max-width:768px){.kg{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="c">

<div class="hd">
  <div>
    <a href="/" class="back">&larr; Dashboard principal</a>
    <h1>S5 vs S6 <span class="strategy">Estrategia: bajar inversión + cosechar</span></h1>
    <p class="sub" id="subtitle">Cargando...</p>
  </div>
</div>

<!-- KPIs resumen -->
<div class="kg" id="kpis"></div>

<!-- Tabla VENTA S5 vs S6 -->
<div class="s">
  <div class="st">Venta diaria — S6 vs S5</div>
  <div class="cd" style="overflow-x:auto" id="table-venta"></div>
</div>

<!-- Tabla INVERSIÓN S5 vs S6 -->
<div class="s">
  <div class="st">Inversión diaria — S6 vs S5 vs Presupuesto</div>
  <div class="cd" style="overflow-x:auto" id="table-inversion"></div>
</div>

<!-- Tabla VENTA vs META -->
<div class="s">
  <div class="st">Venta vs Meta ($120M) — avance diario</div>
  <div class="cd" style="overflow-x:auto" id="table-meta"></div>
</div>

<!-- Insight -->
<div class="s" id="insight-section"></div>

<div class="foot">Premios Increíbles — M&P Performance · Actualizado <span id="updated"></span></div>

</div>

<script>
const fmt = n => '$' + Math.round(n).toLocaleString('es-CL');
const fmtK = n => n >= 1000000 ? '$' + (n/1000000).toFixed(1) + 'M' : '$' + Math.round(n/1000).toLocaleString('es-CL') + 'K';
const pct = n => (n > 0 ? '+' : '') + n + '%';
const cls = n => n > 0 ? 'up' : n < 0 ? 'dn' : 'nt';

// Presupuesto diario S6 (49 días)
const PPTO_DAILY = [230000,341314,423788,362392,381716,404828,502781,359962,465270,573928,487709,510627,538414,664973,473534,608913,747385,632066,658707,691451,850299,602983,772243,944159,795462,825957,863940,1058761,748308,955260,1164250,977897,1012375,1055880,1290359,909510,1157965,1407658,1179372,1217964,1267271,1545092,1086588,1380356,1674383,1399886,1442721,1498114,1822962];
const TOTAL_PPTO = PPTO_DAILY.reduce((a,b)=>a+b,0);

// Meta venta $120M distribuida según curva real de S5
// S5 vendió $108.3M en 57 días. Cada día tiene un % del total. Ese % aplicado a $120M = meta diaria.
// Si S6 tiene menos de 57 días en el ppto, se redistribuye proporcionalmente.
const TOTAL_META = 120000000;
// % de venta por día en S5 (57 días) — calculado de data real WooCommerce
const S5_PCT = [0.26,0.33,0.84,0.45,0.16,0.55,0.62,0.24,0.64,0.67,0.56,0.55,0.54,0.87,0.48,0.68,0.60,0.53,0.47,0.39,0.79,0.37,0.86,0.70,0.60,0.82,0.58,1.07,0.45,0.88,1.47,0.80,1.06,1.11,1.28,0.72,1.36,0.89,1.07,1.30,0.87,2.26,1.41,1.21,1.14,1.60,1.41,2.02,1.46,2.64,2.94,5.08,4.93,6.60,6.58,8.83,10.92];
// Para 49 días de ppto, tomar los primeros 49 y reescalar a 100%
const s5Slice = S5_PCT.slice(0, PPTO_DAILY.length);
const s5SliceSum = s5Slice.reduce((a,b) => a+b, 0);
const META_DAILY = s5Slice.map(p => Math.round(TOTAL_META * p / s5SliceSum));
META_DAILY[META_DAILY.length-1] += TOTAL_META - META_DAILY.reduce((a,b)=>a+b,0);

// Calendario lives S6: miércoles y sábados
const LIVES_RRSS = ['2026-07-22','2026-07-25','2026-07-29','2026-08-01','2026-08-05','2026-08-08','2026-08-12','2026-08-15','2026-08-19','2026-08-22','2026-08-26','2026-08-29','2026-09-02','2026-09-05'];
function isLive(date) { return LIVES_RRSS.includes(date); }

async function load() {
  const res = await fetch('comparacion-s5-s6.json?v=' + Date.now());
  const data = await res.json();
  render(data);
}

function render(data) {
  const { summary: s, comparison: rows } = data;
  const compared = rows.filter(r => r.s5 && r.s6);

  document.getElementById('subtitle').textContent =
    `${s.days_compared} días comparados · S5: ${s.s5_start} · S6: ${s.s6_start} · Act. ${data.updated.substring(0, 16).replace('T', ' ')}`;
  document.getElementById('updated').textContent = data.updated.substring(0, 16).replace('T', ' ');

  // KPIs
  const kpis = document.getElementById('kpis');
  const cards = [
    { label: 'Venta S6', value: fmtK(s.s6.revenue), sub: `S5: ${fmtK(s.s5.revenue)}`, delta: s.delta.revenue_pct, type: 's6' },
    { label: 'Órdenes S6', value: s.s6.orders, sub: `S5: ${s.s5.orders}`, delta: s.delta.orders_pct, type: 's6' },
    { label: 'Ticket S6', value: fmt(s.s6.avg_ticket), sub: `S5: ${fmt(s.s5.avg_ticket)}`, delta: s.delta.ticket_pct, type: 's6' },
    { label: 'Inversión S6', value: fmtK(s.s6.spend), sub: `S5: ${fmtK(s.s5.spend)}`, delta: s.delta.spend_pct, type: 'delta' },
    { label: 'ROAS S6', value: s.s6.roas + 'x', sub: `S5: ${s.s5.roas}x`, delta: s.s5.roas > 0 ? Math.round((s.s6.roas - s.s5.roas) / s.s5.roas * 100) : 0, type: 's6' },
    { label: 'Días', value: s.days_compared + ' / ' + s.s5_total_days, sub: 'comparados / total S5', delta: null, type: 'delta' },
  ];
  kpis.innerHTML = cards.map(c => `
    <div class="k ${c.type}">
      <div class="kv ${c.type === 's6' ? 's6c' : ''}">${c.value}</div>
      <div class="kl">${c.label}</div>
      <div class="ksub">${c.sub}${c.delta !== null ? ` · <span class="${cls(c.delta)}">${pct(c.delta)}</span>` : ''}</div>
    </div>
  `).join('');

  // Tabla 1: Venta S6 vs S5
  renderVentaTable(compared, 'table-venta');

  // Tabla 2: Inversión S6 vs S5 vs Ppto
  renderInversionTable(compared, 'table-inversion');

  // Tabla 3: Venta vs Meta $120M
  renderMetaTable(rows, 'table-meta');

  // Insight
  renderInsight(s, compared, 'insight-section');
}

function renderVentaTable(rows, containerId) {
  const el = document.getElementById(containerId);
  let html = `<table>
    <thead><tr>
      <th>Día</th><th></th><th></th>
      <th class="r">S5 Venta</th><th class="r">S5 Ord</th>
      <th class="r sep">S6 Venta</th><th class="r">S6 Ord</th><th class="r">S6 Inv</th>
      <th class="r sep">Δ% Venta</th><th class="r">S6 vs S5</th><th class="r sep">Venta > Inv?</th>
    </tr></thead><tbody>`;

  let cumS5 = {rev:0,ord:0}, cumS6 = {rev:0,ord:0,sp:0};
  for (const r of rows) {
    const s5 = r.s5||{}, s6 = r.s6||{};
    const d = s5.revenue > 0 ? Math.round((s6.revenue - s5.revenue) / s5.revenue * 100) : 0;
    const diff = (s6.revenue||0) - (s5.revenue||0);
    const live = isLive(s6.date||'');
    const ventaVsInv = (s6.revenue||0) - (s6.spend||0);
    cumS5.rev += s5.revenue||0; cumS5.ord += s5.orders||0;
    cumS6.rev += s6.revenue||0; cumS6.ord += s6.orders||0; cumS6.sp += s6.spend||0;
    html += `<tr${ventaVsInv < 0 ? ' style="background:rgba(239,68,68,0.08)"' : ''}>
      <td class="b">D${r.day}</td>
      <td style="color:rgba(255,255,255,0.3);font-size:9px">${s6.dow||''}</td>
      <td style="font-size:9px">${live ? '<span style="color:#FFD700;font-weight:800">📺 LIVE</span>' : ''}</td>
      <td class="r">${fmt(s5.revenue||0)}</td><td class="r">${s5.orders||0}</td>
      <td class="r b sep">${fmt(s6.revenue||0)}</td><td class="r b">${s6.orders||0}</td><td class="r" style="color:rgba(255,255,255,0.4)">${fmt(s6.spend||0)}</td>
      <td class="r sep ${cls(d)}">${pct(d)}</td>
      <td class="r ${cls(diff)}" style="font-weight:700">${diff >= 0 ? '+' : ''}${fmtK(diff)}</td>
      <td class="r sep ${ventaVsInv >= 0 ? 'up' : 'dn'}" style="font-weight:700">${ventaVsInv >= 0 ? 'SÍ +'+fmtK(ventaVsInv) : 'NO '+fmtK(ventaVsInv)}</td>
    </tr>`;
  }
  const dTot = cumS5.rev > 0 ? Math.round((cumS6.rev-cumS5.rev)/cumS5.rev*100) : 0;
  const totVtaVsInv = cumS6.rev - cumS6.sp;
  html += `<tr style="background:rgba(255,215,0,0.06);font-weight:800">
    <td class="b" colspan="3">TOTAL</td>
    <td class="r">${fmtK(cumS5.rev)}</td><td class="r">${cumS5.ord}</td>
    <td class="r b sep">${fmtK(cumS6.rev)}</td><td class="r b">${cumS6.ord}</td><td class="r" style="color:rgba(255,255,255,0.4)">${fmtK(cumS6.sp)}</td>
    <td class="r sep ${cls(dTot)}">${pct(dTot)}</td>
    <td class="r ${cls(cumS6.rev-cumS5.rev)}" style="font-weight:700">${fmtK(cumS6.rev-cumS5.rev)}</td>
    <td class="r sep ${totVtaVsInv >= 0 ? 'up' : 'dn'}" style="font-weight:700">${totVtaVsInv >= 0 ? 'SÍ +'+fmtK(totVtaVsInv) : 'NO '+fmtK(totVtaVsInv)}</td>
  </tr></tbody></table>`;
  el.innerHTML = html;
}

function renderInversionTable(rows, containerId) {
  const el = document.getElementById(containerId);
  let html = `<table>
    <thead><tr>
      <th>Día</th><th></th>
      <th class="r">S5 Inv</th><th class="r">S5 CPA</th>
      <th class="r sep">S6 Inv</th><th class="r">S6 CPA</th>
      <th class="r sep">Ppto</th><th class="r">Δ vs Ppto</th>
      <th class="r sep">%Inv/Vta S5</th><th class="r">%Inv/Vta S6</th>
    </tr></thead><tbody>`;

  let cumS5 = {sp:0,rev:0,ord:0}, cumS6 = {sp:0,rev:0,ord:0}, cumPpto = 0;
  for (const r of rows) {
    const s5 = r.s5||{}, s6 = r.s6||{};
    const idx = r.day - 1;
    const ppto = PPTO_DAILY[idx]||0;
    cumPpto += ppto;
    const s5cpa = (s5.orders||0)>0 ? (s5.spend||0)/s5.orders : 0;
    const s6cpa = (s6.orders||0)>0 ? (s6.spend||0)/s6.orders : 0;
    const dPpto = ppto>0 ? Math.round(((s6.spend||0)-ppto)/ppto*100) : 0;
    const s5pct = (s5.revenue||0)>0 ? ((s5.spend||0)/s5.revenue*100) : 0;
    const s6pct = (s6.revenue||0)>0 ? ((s6.spend||0)/s6.revenue*100) : 0;
    cumS5.sp+=s5.spend||0; cumS5.rev+=s5.revenue||0; cumS5.ord+=s5.orders||0;
    cumS6.sp+=s6.spend||0; cumS6.rev+=s6.revenue||0; cumS6.ord+=s6.orders||0;
    html += `<tr>
      <td class="b">D${r.day}</td><td style="color:rgba(255,255,255,0.3);font-size:9px">${s6.dow||''}</td>
      <td class="r">${fmt(s5.spend||0)}</td><td class="r">${s5cpa>0?fmt(s5cpa):'—'}</td>
      <td class="r b sep">${fmt(s6.spend||0)}</td><td class="r b">${s6cpa>0?fmt(s6cpa):'—'}</td>
      <td class="r sep" style="color:rgba(255,255,255,0.4)">${fmt(ppto)}</td>
      <td class="r ${cls(-dPpto)}">${pct(dPpto)}</td>
      <td class="r sep ${s5pct>100?'dn':s5pct>50?'nt':'up'}">${s5pct>0?s5pct.toFixed(0)+'%':'—'}</td>
      <td class="r ${s6pct>100?'dn':s6pct>50?'nt':'up'}">${s6pct>0?s6pct.toFixed(0)+'%':'—'}</td>
    </tr>`;
  }
  const s5cpaTot = cumS5.ord>0?cumS5.sp/cumS5.ord:0;
  const s6cpaTot = cumS6.ord>0?cumS6.sp/cumS6.ord:0;
  const dPptoTot = cumPpto>0?Math.round((cumS6.sp-cumPpto)/cumPpto*100):0;
  html += `<tr style="background:rgba(255,215,0,0.06);font-weight:800">
    <td class="b" colspan="2">TOTAL</td>
    <td class="r">${fmtK(cumS5.sp)}</td><td class="r">${fmt(s5cpaTot)}</td>
    <td class="r b sep">${fmtK(cumS6.sp)}</td><td class="r b">${fmt(s6cpaTot)}</td>
    <td class="r sep" style="color:rgba(255,255,255,0.4)">${fmtK(cumPpto)}</td>
    <td class="r ${cls(-dPptoTot)}">${pct(dPptoTot)}</td>
    <td class="r sep">${cumS5.rev>0?(cumS5.sp/cumS5.rev*100).toFixed(0)+'%':'—'}</td>
    <td class="r">${cumS6.rev>0?(cumS6.sp/cumS6.rev*100).toFixed(0)+'%':'—'}</td>
  </tr></tbody></table>`;
  el.innerHTML = html;
}

function renderMetaTable(rows, containerId) {
  const el = document.getElementById(containerId);
  const s6rows = rows.filter(r => r.s6);
  let html = `<table>
    <thead><tr>
      <th>Día</th><th></th><th>Fecha</th>
      <th class="r">Venta Real</th><th class="r">Meta Día</th><th class="r">Δ Meta</th>
      <th class="r sep">Vta Acum</th><th class="r">Meta Acum</th><th class="r">% Meta</th>
      <th class="r sep">Falta p/ meta</th>
    </tr></thead><tbody>`;

  let cumVta = 0, cumMeta = 0;
  for (let i = 0; i < s6rows.length; i++) {
    const r = s6rows[i];
    const s6 = r.s6;
    const idx = r.day - 1;
    const meta = META_DAILY[idx]||0;
    const vta = s6.revenue||0;
    cumVta += vta; cumMeta += meta;
    const dMeta = meta>0 ? Math.round((vta-meta)/meta*100) : 0;
    const pctMeta = cumMeta>0 ? Math.round(cumVta/cumMeta*100) : 0;
    const falta = TOTAL_META - cumVta;
    html += `<tr>
      <td class="b">D${r.day}</td>
      <td style="color:rgba(255,255,255,0.3);font-size:9px">${s6.dow||''}</td>
      <td style="font-size:9px;color:rgba(255,255,255,0.4)">${s6.date||''}</td>
      <td class="r b">${fmt(vta)}</td>
      <td class="r" style="color:rgba(255,255,255,0.4)">${fmt(meta)}</td>
      <td class="r ${cls(dMeta)}">${pct(dMeta)}</td>
      <td class="r b sep">${fmtK(cumVta)}</td>
      <td class="r" style="color:rgba(255,255,255,0.4)">${fmtK(cumMeta)}</td>
      <td class="r ${cls(pctMeta-100)}" style="font-weight:700">${pctMeta}%</td>
      <td class="r sep" style="color:rgba(255,255,255,0.3)">${fmtK(falta)}</td>
    </tr>`;
  }
  const pctTotal = cumMeta>0?Math.round(cumVta/cumMeta*100):0;
  const remDays = PPTO_DAILY.length - s6rows.length;
  const faltaTotal = TOTAL_META - cumVta;
  html += `<tr style="background:rgba(255,215,0,0.06);font-weight:800">
    <td class="b" colspan="3">ACUMULADO</td>
    <td class="r b">${fmtK(cumVta)}</td><td class="r">${fmtK(cumMeta)}</td>
    <td class="r ${cls(pctTotal-100)}">${pctTotal}%</td>
    <td class="r b sep">${fmtK(cumVta)}</td><td class="r">${fmtK(TOTAL_META)}</td>
    <td class="r ${cls(pctTotal-100)}" style="font-size:14px">${Math.round(cumVta/TOTAL_META*100)}%</td>
    <td class="r sep" style="color:#FFD700">${fmtK(faltaTotal)}</td>
  </tr>`;
  if (remDays > 0) {
    html += `<tr style="background:rgba(139,92,246,0.06)">
      <td colspan="3" style="font-size:10px;font-weight:700;color:#8B5CF6">Faltan ${remDays} días</td>
      <td colspan="3"></td>
      <td class="r sep" colspan="2" style="font-size:10px;color:rgba(255,255,255,0.3)">Promedio diario necesario</td>
      <td class="r" style="color:#FFD700;font-weight:700">${fmtK(faltaTotal/remDays)}/día</td>
      <td></td>
    </tr>`;
  }
  html += '</tbody></table>';
  el.innerHTML = html;
}

function DEPRECATED_renderTable(rows, containerId) {
  const el = document.getElementById(containerId);
  let html = `<table>
    <thead><tr>
      <th>Día</th><th></th>
      <th class="r">S5 Inv</th><th class="r">S5 Venta</th><th class="r">S5 CPA</th><th class="r">S5 %CPA/Vta</th>
      <th class="r sep">S6 Inv</th><th class="r">S6 Venta</th><th class="r">S6 CPA</th><th class="r">S6 %CPA/Vta</th>
      <th class="r sep">Δ Venta</th><th class="r">Δ Inv</th>
    </tr></thead><tbody>`;

  let cumS5 = {sp:0,rev:0,ord:0}, cumS6 = {sp:0,rev:0,ord:0};

  for (const r of rows) {
    const s5 = r.s5 || {}, s6 = r.s6 || {};
    const s5cpa = (s5.orders||0) > 0 ? (s5.spend||0) / s5.orders : 0;
    const s6cpa = (s6.orders||0) > 0 ? (s6.spend||0) / s6.orders : 0;
    const s5pct = (s5.revenue||0) > 0 ? ((s5.spend||0) / s5.revenue * 100) : 0;
    const s6pct = (s6.revenue||0) > 0 ? ((s6.spend||0) / s6.revenue * 100) : 0;
    const dRev = r.delta?.revenue_pct || 0;
    const dSpend = r.delta?.spend_pct || 0;

    cumS5.sp += s5.spend||0; cumS5.rev += s5.revenue||0; cumS5.ord += s5.orders||0;
    cumS6.sp += s6.spend||0; cumS6.rev += s6.revenue||0; cumS6.ord += s6.orders||0;

    html += `<tr>
      <td class="b">D${r.day}</td>
      <td style="color:rgba(255,255,255,0.3);font-size:9px">${s6.dow || s5.dow || ''}</td>
      <td class="r">${fmt(s5.spend || 0)}</td>
      <td class="r">${fmt(s5.revenue || 0)}</td>
      <td class="r">${s5cpa > 0 ? fmt(s5cpa) : '—'}</td>
      <td class="r ${s5pct > 100 ? 'dn' : s5pct > 50 ? 'nt' : 'up'}">${s5pct > 0 ? s5pct.toFixed(0)+'%' : '—'}</td>
      <td class="r b sep">${fmt(s6.spend || 0)}</td>
      <td class="r b">${fmt(s6.revenue || 0)}</td>
      <td class="r b">${s6cpa > 0 ? fmt(s6cpa) : '—'}</td>
      <td class="r b ${s6pct > 100 ? 'dn' : s6pct > 50 ? 'nt' : 'up'}">${s6pct > 0 ? s6pct.toFixed(0)+'%' : '—'}</td>
      <td class="r sep ${cls(dRev)}">${pct(dRev)}</td>
      <td class="r ${cls(-dSpend)}">${pct(dSpend)}</td>
    </tr>`;
  }

  // Totals
  const s5cpaTot = cumS5.ord > 0 ? cumS5.sp / cumS5.ord : 0;
  const s6cpaTot = cumS6.ord > 0 ? cumS6.sp / cumS6.ord : 0;
  const s5pctTot = cumS5.rev > 0 ? (cumS5.sp / cumS5.rev * 100) : 0;
  const s6pctTot = cumS6.rev > 0 ? (cumS6.sp / cumS6.rev * 100) : 0;
  html += `<tr style="background:rgba(255,215,0,0.06);font-weight:800">
    <td class="b" colspan="2">TOTAL</td>
    <td class="r">${fmtK(cumS5.sp)}</td><td class="r">${fmtK(cumS5.rev)}</td>
    <td class="r">${fmt(s5cpaTot)}</td><td class="r">${s5pctTot.toFixed(0)}%</td>
    <td class="r b sep">${fmtK(cumS6.sp)}</td><td class="r b">${fmtK(cumS6.rev)}</td>
    <td class="r b">${fmt(s6cpaTot)}</td><td class="r b">${s6pctTot.toFixed(0)}%</td>
    <td class="r sep ${cls(cumS5.rev > 0 ? Math.round((cumS6.rev-cumS5.rev)/cumS5.rev*100) : 0)}">${cumS5.rev > 0 ? pct(Math.round((cumS6.rev-cumS5.rev)/cumS5.rev*100)) : '—'}</td>
    <td class="r ${cls(-(cumS5.sp > 0 ? Math.round((cumS6.sp-cumS5.sp)/cumS5.sp*100) : 0))}">${cumS5.sp > 0 ? pct(Math.round((cumS6.sp-cumS5.sp)/cumS5.sp*100)) : '—'}</td>
  </tr>`;
  html += '</tbody></table>';
  el.innerHTML = html;
}

function renderPptoTable(rows, containerId) {
  const el = document.getElementById(containerId);
  // Solo S6 rows
  const s6rows = rows.filter(r => r.s6);

  let html = `<table>
    <thead><tr>
      <th>Día</th><th></th><th>Fecha</th>
      <th class="r">Inv Real</th><th class="r">Ppto Inv</th><th class="r">Δ Inv</th>
      <th class="r sep">Venta Real</th><th class="r">Meta Venta</th><th class="r">Δ Meta</th>
      <th class="r sep">CPA</th><th class="r">%Inv/Vta</th>
      <th class="r sep">Inv Acum</th><th class="r">Ppto Acum</th><th class="r">Vta Acum</th><th class="r">Meta Acum</th>
    </tr></thead><tbody>`;

  let cumInv = 0, cumPpto = 0, cumVta = 0, cumMeta = 0;

  for (let i = 0; i < s6rows.length; i++) {
    const r = s6rows[i];
    const s6 = r.s6;
    const dayIdx = r.day - 1;
    const ppto = PPTO_DAILY[dayIdx] || 0;
    const meta = META_DAILY[dayIdx] || 0;
    const inv = s6.spend || 0;
    const vta = s6.revenue || 0;
    const cpa = (s6.orders||0) > 0 ? inv / s6.orders : 0;
    const invVtaPct = vta > 0 ? (inv / vta * 100) : 0;

    cumInv += inv; cumPpto += ppto; cumVta += vta; cumMeta += meta;

    const dInv = ppto > 0 ? Math.round((inv - ppto) / ppto * 100) : 0;
    const dMeta = meta > 0 ? Math.round((vta - meta) / meta * 100) : 0;

    html += `<tr>
      <td class="b">D${r.day}</td>
      <td style="color:rgba(255,255,255,0.3);font-size:9px">${s6.dow || ''}</td>
      <td style="font-size:9px;color:rgba(255,255,255,0.4)">${s6.date || ''}</td>
      <td class="r b">${fmt(inv)}</td>
      <td class="r" style="color:rgba(255,255,255,0.4)">${fmt(ppto)}</td>
      <td class="r ${cls(-dInv)}">${pct(dInv)}</td>
      <td class="r b sep">${fmt(vta)}</td>
      <td class="r" style="color:rgba(255,255,255,0.4)">${fmt(meta)}</td>
      <td class="r ${cls(dMeta)}">${pct(dMeta)}</td>
      <td class="r sep ${cpa > 0 ? '' : ''}">${cpa > 0 ? fmt(cpa) : '—'}</td>
      <td class="r ${invVtaPct > 100 ? 'dn' : invVtaPct > 50 ? 'nt' : 'up'}">${invVtaPct > 0 ? invVtaPct.toFixed(0)+'%' : '—'}</td>
      <td class="r sep" style="font-size:10px">${fmtK(cumInv)}</td>
      <td class="r" style="font-size:10px;color:rgba(255,255,255,0.4)">${fmtK(cumPpto)}</td>
      <td class="r b" style="font-size:10px">${fmtK(cumVta)}</td>
      <td class="r" style="font-size:10px;color:rgba(255,255,255,0.4)">${fmtK(cumMeta)}</td>
    </tr>`;
  }

  // Totals
  const cpaTot = cumVta > 0 ? cumInv / (s6rows.reduce((a,r) => a + (r.s6?.orders||0), 0) || 1) : 0;
  const pctTot = cumVta > 0 ? (cumInv / cumVta * 100) : 0;
  const dInvTot = cumPpto > 0 ? Math.round((cumInv - cumPpto) / cumPpto * 100) : 0;
  const dMetaTot = cumMeta > 0 ? Math.round((cumVta - cumMeta) / cumMeta * 100) : 0;

  html += `<tr style="background:rgba(255,215,0,0.06);font-weight:800">
    <td class="b" colspan="3">TOTAL</td>
    <td class="r b">${fmtK(cumInv)}</td>
    <td class="r">${fmtK(cumPpto)}</td>
    <td class="r ${cls(-dInvTot)}">${pct(dInvTot)}</td>
    <td class="r b sep">${fmtK(cumVta)}</td>
    <td class="r">${fmtK(cumMeta)}</td>
    <td class="r ${cls(dMetaTot)}">${pct(dMetaTot)}</td>
    <td class="r sep b">${fmt(cpaTot)}</td>
    <td class="r ${pctTot > 100 ? 'dn' : pctTot > 50 ? 'nt' : 'up'}">${pctTot.toFixed(0)}%</td>
    <td class="r sep b">${fmtK(cumInv)}</td>
    <td class="r">${fmtK(TOTAL_PPTO)}</td>
    <td class="r b">${fmtK(cumVta)}</td>
    <td class="r">${fmtK(TOTAL_META)}</td>
  </tr>`;

  // Remaining row
  const remInv = TOTAL_PPTO - cumInv;
  const remMeta = TOTAL_META - cumVta;
  const remDays = PPTO_DAILY.length - s6rows.length;
  html += `<tr style="background:rgba(139,92,246,0.06)">
    <td colspan="3" style="font-size:10px;font-weight:700;color:#8B5CF6">FALTA (${remDays} días)</td>
    <td class="r" colspan="2" style="color:#8B5CF6;font-weight:700">${fmtK(Math.max(remInv,0))}</td>
    <td></td>
    <td class="r sep" colspan="2" style="color:#FFD700;font-weight:700">${fmtK(Math.max(remMeta,0))}</td>
    <td></td>
    <td colspan="2"></td>
    <td colspan="4" style="font-size:9px;color:rgba(255,255,255,0.3);text-align:right">${remDays > 0 ? 'Promedio diario necesario: Inv ' + fmtK(Math.max(remInv,0)/Math.max(remDays,1)) + ' · Vta ' + fmtK(Math.max(remMeta,0)/Math.max(remDays,1)) : 'Sorteo terminado'}</td>
  </tr>`;

  html += '</tbody></table>';
  el.innerHTML = html;
}

function renderInsight(s, rows, containerId) {
  const el = document.getElementById(containerId);
  const spendDown = s.delta.spend_pct < 0;
  const revUp = s.delta.revenue_pct > 0;

  // S6 vs Meta progress
  const s6Days = rows.filter(r => r.s6).length;
  const cumMetaSoFar = META_DAILY.slice(0, s6Days).reduce((a,b)=>a+b,0);
  const metaPct = cumMetaSoFar > 0 ? Math.round(s.s6.revenue / cumMetaSoFar * 100) : 0;

  let msg = '';
  if (spendDown && revUp) {
    msg = `Estrategia funcionando: inversión ${pct(s.delta.spend_pct)} pero venta ${pct(s.delta.revenue_pct)}. ROAS S6 ${s.s6.roas}x vs S5 ${s.s5.roas}x.`;
  } else if (spendDown && !revUp) {
    msg = `Inversión bajó ${pct(s.delta.spend_pct)} y venta ${pct(s.delta.revenue_pct)}. Monitorear semana 2.`;
  } else if (!spendDown && revUp) {
    msg = `Inversión subió ${pct(s.delta.spend_pct)} pero venta subió más ${pct(s.delta.revenue_pct)}.`;
  } else {
    msg = `Ambas métricas en ajuste. Comparar tras semana 2.`;
  }

  el.innerHTML = `
    <div class="insight">
      <h4>Lectura automática (${s.days_compared} días)</h4>
      <p>${msg}</p>
      <p style="margin-top:6px">Meta de venta: al día ${s6Days} deberían ir ${fmtK(cumMetaSoFar)} y van ${fmtK(s.s6.revenue)} (<span class="${cls(metaPct-100)}">${metaPct}% de la meta</span>).</p>
    </div>
  `;
}

load();
setInterval(load, 600000);
</script>
